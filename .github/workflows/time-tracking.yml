name: Time Tracking

on:
  push:
    branches: [main]
  pull_request_review:
    types: [submitted]

jobs:
  track-time:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse time entries and update report
        uses: actions/github-script@v7
        with:
          script: |
            const TRACKING_ISSUE_LABEL = 'time-tracking';
            const DATA_MARKER_START = '<!-- REVIEWS_DATA';
            const DATA_MARKER_END = 'REVIEWS_DATA -->';

            // --- Helpers ---
            function parseTime(str) {
              let minutes = 0;
              const h = str.match(/(\d+)\s*h/i);
              const m = str.match(/(\d+)\s*m(?:in)?/i);
              if (h) minutes += parseInt(h[1]) * 60;
              if (m) minutes += parseInt(m[1]);
              return minutes;
            }

            function formatTime(minutes) {
              if (minutes === 0) return '0m';
              const h = Math.floor(minutes / 60);
              const m = minutes % 60;
              if (h === 0) return `${m}m`;
              if (m === 0) return `${h}h`;
              return `${h}h${m.toString().padStart(2, '0')}`;
            }

            function toFRDate(isoDate) {
              const [y, m, d] = isoDate.split('-');
              return `${d}/${m}/${y}`;
            }

            function progressBar(ratio, length = 10) {
              const filled = Math.round(ratio * length);
              return '█'.repeat(filled) + '░'.repeat(length - filled);
            }

            function getMonday(date) {
              const d = new Date(date);
              const day = d.getDay();
              const diff = d.getDate() - day + (day === 0 ? -6 : 1);
              d.setDate(diff);
              return d.toISOString().split('T')[0];
            }

            const monthNames = [
              'Janvier', 'Fevrier', 'Mars', 'Avril', 'Mai', 'Juin',
              'Juillet', 'Aout', 'Septembre', 'Octobre', 'Novembre', 'Decembre'
            ];

            // =============================================
            // 1. COLLECT COMMIT ENTRIES (from git log)
            // =============================================
            const emailToUsername = {};
            for (const commit of (context.payload.commits || [])) {
              if (commit.author.email && commit.author.username) {
                emailToUsername[commit.author.email] = commit.author.username;
              }
            }

            const { execSync } = require('child_process');
            const SEP = '---COMMIT---';
            const raw = execSync(
              `git log --format="${SEP}%n%H%n%aI%n%ae%n%B" HEAD`,
              { encoding: 'utf-8', maxBuffer: 10 * 1024 * 1024 }
            );

            const commitEntries = [];
            const commitBlocks = raw.split(SEP).filter(Boolean);

            for (const block of commitBlocks) {
              const lines = block.trim().split('\n');
              if (lines.length < 3) continue;

              const hash = lines[0];
              const dateISO = lines[1].split('T')[0];
              const email = lines[2];
              const message = lines.slice(3).join('\n');

              const timeMatch = message.match(/Time-spent:\s*(.+)/i);
              if (!timeMatch) continue;

              const time = timeMatch[1].trim();
              const issueMatch = message.match(/Refs:\s*#(\d+)/i);
              const issue = issueMatch ? `#${issueMatch[1]}` : '-';
              const subject = message.split('\n')[0];
              const sha = hash.substring(0, 7);
              const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${hash}`;

              let author = emailToUsername[email];
              if (!author) {
                try {
                  const { data } = await github.rest.repos.listCommits({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    sha: hash,
                    per_page: 1,
                  });
                  if (data[0]?.author?.login) {
                    author = data[0].author.login;
                    emailToUsername[email] = author;
                  }
                } catch (e) {}
              }
              if (!author) author = email.split('@')[0];

              commitEntries.push({
                type: 'commit',
                date: dateISO,
                sha,
                url,
                subject,
                issue,
                time,
                author,
                minutes: parseTime(time),
              });
            }

            // =============================================
            // 2. COLLECT REVIEW ENTRIES (from issue data + new event)
            // =============================================

            // First, find the tracking issue to load existing review data
            let trackingIssue;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: TRACKING_ISSUE_LABEL,
              state: 'open',
            });
            trackingIssue = issues.length > 0 ? issues[0] : null;

            // Load existing review entries from hidden data block
            let reviewEntries = [];
            if (trackingIssue) {
              const body = trackingIssue.body || '';
              const dataMatch = body.match(/<!-- REVIEWS_DATA\n([\s\S]*?)\nREVIEWS_DATA -->/);
              if (dataMatch) {
                for (const line of dataMatch[1].trim().split('\n')) {
                  const parts = line.split('|');
                  if (parts.length === 7) {
                    reviewEntries.push({
                      type: 'review',
                      date: parts[0],
                      id: parts[1],
                      url: parts[2],
                      subject: parts[3],
                      issue: parts[4],
                      time: parts[5],
                      author: parts[6],
                      minutes: parseTime(parts[5]),
                    });
                  }
                }
              }
            }

            // If this is a review event, add the new review entry
            if (context.eventName === 'pull_request_review') {
              const review = context.payload.review;
              const reviewBody = review.body || '';
              const timeMatch = reviewBody.match(/Time-spent:\s*(.+)/i);

              if (timeMatch) {
                const time = timeMatch[1].trim();
                const pr = context.payload.pull_request;
                const prNumber = `#${pr.number}`;
                const reviewId = `r${review.id}`;
                const dateISO = review.submitted_at.split('T')[0];
                const author = review.user.login;

                // Deduplicate
                if (!reviewEntries.some(e => e.id === reviewId)) {
                  reviewEntries.push({
                    type: 'review',
                    date: dateISO,
                    id: reviewId,
                    url: review.html_url,
                    subject: `Review PR ${prNumber}: ${pr.title}`,
                    issue: prNumber,
                    time,
                    author,
                    minutes: parseTime(time),
                  });
                }
              }
            }

            // =============================================
            // 3. MERGE & BUILD REPORT
            // =============================================
            const allEntries = [
              ...commitEntries.map(e => ({ ...e, sortKey: `${e.date}-${e.sha}` })),
              ...reviewEntries.map(e => ({ ...e, sortKey: `${e.date}-${e.id}` })),
            ];

            if (allEntries.length === 0) {
              console.log('No time entries found.');
              return;
            }

            allEntries.sort((a, b) => b.date.localeCompare(a.date));

            const totalMinutes = allEntries.reduce((sum, e) => sum + e.minutes, 0);

            // This week
            const mondayThisWeek = getMonday(new Date());
            const thisWeekEntries = allEntries.filter(e => e.date >= mondayThisWeek);
            const thisWeekMinutes = thisWeekEntries.reduce((sum, e) => sum + e.minutes, 0);

            // By issue
            const byIssue = {};
            for (const e of allEntries) {
              if (!byIssue[e.issue]) byIssue[e.issue] = { minutes: 0, count: 0 };
              byIssue[e.issue].minutes += e.minutes;
              byIssue[e.issue].count++;
            }

            // By month
            const byMonth = new Map();
            for (const e of allEntries) {
              const d = new Date(e.date + 'T00:00:00Z');
              const key = `${monthNames[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
              byMonth.set(key, (byMonth.get(key) || 0) + e.minutes);
            }

            // By type (dev vs review)
            const devMinutes = commitEntries.reduce((sum, e) => sum + e.minutes, 0);
            const reviewMinutes = reviewEntries.reduce((sum, e) => sum + e.minutes, 0);

            // By author
            const byAuthor = {};
            for (const e of allEntries) {
              if (!byAuthor[e.author]) byAuthor[e.author] = { dev: 0, review: 0, total: 0, count: 0 };
              byAuthor[e.author].total += e.minutes;
              byAuthor[e.author].count++;
              if (e.type === 'review') byAuthor[e.author].review += e.minutes;
              else byAuthor[e.author].dev += e.minutes;
            }

            // --- Render ---
            let report = `# Time Tracking Report\n\n`;

            report += `| Total | Dev | Review | Cette semaine | Entries |\n`;
            report += `|-------|-----|--------|---------------|--------|\n`;
            report += `| **${formatTime(totalMinutes)}** | ${formatTime(devMinutes)} | ${formatTime(reviewMinutes)} | **${formatTime(thisWeekMinutes)}** | **${allEntries.length}** |\n\n`;

            // This week (collapsed)
            if (thisWeekEntries.length > 0) {
              report += `<details>\n<summary><strong>Cette semaine</strong> — ${formatTime(thisWeekMinutes)} (${thisWeekEntries.length} entries)</summary>\n\n`;
              for (const e of thisWeekEntries) {
                const issueTag = e.issue !== '-' ? ` (${e.issue})` : '';
                const icon = e.type === 'review' ? '👁️' : '💻';
                report += `- ${icon} \`${e.time}\` ${e.subject}${issueTag} — @${e.author}\n`;
              }
              report += `\n</details>\n\n`;
            }

            // By author
            report += `### Par auteur\n\n`;
            report += `| Auteur | Total | Dev | Review | | Entries |\n`;
            report += `|--------|-------|-----|--------|---|--------|\n`;
            const sortedAuthors = Object.entries(byAuthor).sort((a, b) => b[1].total - a[1].total);
            for (const [author, data] of sortedAuthors) {
              const ratio = totalMinutes > 0 ? data.total / totalMinutes : 0;
              const pct = Math.round(ratio * 100);
              report += `| @${author} | ${formatTime(data.total)} | ${formatTime(data.dev)} | ${formatTime(data.review)} | \`${progressBar(ratio)}\` ${pct}% | ${data.count} |\n`;
            }

            // By issue
            report += `\n### Par issue\n\n`;
            report += `| Issue | Temps | | Entries |\n`;
            report += `|-------|-------|---|--------|\n`;
            const sortedIssues = Object.entries(byIssue).sort((a, b) => b[1].minutes - a[1].minutes);
            for (const [issue, data] of sortedIssues) {
              const ratio = totalMinutes > 0 ? data.minutes / totalMinutes : 0;
              const pct = Math.round(ratio * 100);
              report += `| ${issue} | ${formatTime(data.minutes)} | \`${progressBar(ratio)}\` ${pct}% | ${data.count} |\n`;
            }

            // By month
            report += `\n### Par mois\n\n`;
            report += `| Mois | Temps | |\n`;
            report += `|------|-------|---|\n`;
            const maxMonthMinutes = Math.max(...byMonth.values());
            for (const [month, minutes] of byMonth) {
              const ratio = maxMonthMinutes > 0 ? minutes / maxMonthMinutes : 0;
              report += `| ${month} | ${formatTime(minutes)} | \`${progressBar(ratio)}\` |\n`;
            }

            // Detail (collapsed)
            report += `\n<details>\n<summary><strong>Toutes les entries</strong> — ${allEntries.length} entries</summary>\n\n`;
            report += `| Date | Type | Description | Issue | Temps | Auteur |\n`;
            report += `|------|------|-------------|-------|-------|--------|\n`;
            for (const e of allEntries) {
              const icon = e.type === 'review' ? '👁️ Review' : '💻 Commit';
              const link = e.type === 'commit'
                ? `[\`${e.sha}\`](${e.url}) ${e.subject}`
                : `[Review](${e.url}) ${e.subject}`;
              report += `| ${toFRDate(e.date)} | ${icon} | ${link} | ${e.issue} | ${e.time} | @${e.author} |\n`;
            }
            report += `\n</details>\n\n`;

            // Hidden review data (commits are re-parsed from git, reviews need persistence)
            const reviewDataLines = reviewEntries.map(e =>
              `${e.date}|${e.id}|${e.url}|${e.subject}|${e.issue}|${e.time}|${e.author}`
            );
            report += `<!-- REVIEWS_DATA\n${reviewDataLines.join('\n')}\nREVIEWS_DATA -->`;

            // --- Update/create issue ---
            if (!trackingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Time Tracking Report',
                labels: [TRACKING_ISSUE_LABEL],
                body: report,
              });
              console.log(`Created time tracking issue — ${allEntries.length} entries, total: ${formatTime(totalMinutes)}`);
            } else {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: trackingIssue.number,
                body: report,
              });
              console.log(`Updated #${trackingIssue.number} — ${allEntries.length} entries, total: ${formatTime(totalMinutes)}`);
            }

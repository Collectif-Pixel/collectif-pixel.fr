name: Time Tracking

on:
  push:
    branches: [main]

jobs:
  track-time:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse commits and update time tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const TRACKING_ISSUE_LABEL = 'time-tracking';

            // --- Helpers ---
            function parseTime(str) {
              let minutes = 0;
              const h = str.match(/(\d+)\s*h/i);
              const m = str.match(/(\d+)\s*m(?:in)?/i);
              if (h) minutes += parseInt(h[1]) * 60;
              if (m) minutes += parseInt(m[1]);
              return minutes;
            }

            function formatTime(minutes) {
              if (minutes === 0) return '0m';
              const h = Math.floor(minutes / 60);
              const m = minutes % 60;
              if (h === 0) return `${m}m`;
              if (m === 0) return `${h}h`;
              return `${h}h${m.toString().padStart(2, '0')}`;
            }

            function toISODate(date) {
              return date.toISOString().split('T')[0];
            }

            function toFRDate(isoDate) {
              const [y, m, d] = isoDate.split('-');
              return `${d}/${m}/${y}`;
            }

            const monthNames = [
              'Janvier', 'Fevrier', 'Mars', 'Avril', 'Mai', 'Juin',
              'Juillet', 'Aout', 'Septembre', 'Octobre', 'Novembre', 'Decembre'
            ];

            // --- Find or create the tracking issue ---
            let trackingIssue;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: TRACKING_ISSUE_LABEL,
              state: 'open',
            });

            if (issues.length === 0) {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Time Tracking Report',
                labels: [TRACKING_ISSUE_LABEL],
                body: '<!-- DATA\nDATA -->',
              });
              trackingIssue = created;
            } else {
              trackingIssue = issues[0];
            }

            // --- Parse existing entries from hidden data block ---
            const body = trackingIssue.body || '';
            const dataMatch = body.match(/<!-- DATA\n([\s\S]*?)\nDATA -->/);
            const existingDataRaw = dataMatch ? dataMatch[1].trim() : '';

            // Entry format: date|sha|url|subject|issue|time|author
            let allEntries = [];
            if (existingDataRaw) {
              for (const line of existingDataRaw.split('\n')) {
                const parts = line.split('|');
                if (parts.length === 7) {
                  allEntries.push({
                    date: parts[0],
                    sha: parts[1],
                    url: parts[2],
                    subject: parts[3],
                    issue: parts[4],
                    time: parts[5],
                    author: parts[6],
                    minutes: parseTime(parts[5]),
                  });
                }
              }
            }

            // --- Parse new commits ---
            const commits = context.payload.commits || [];
            let hasNew = false;

            for (const commit of commits) {
              const message = commit.message;
              const timeMatch = message.match(/Time-spent:\s*(.+)/i);
              if (!timeMatch) continue;

              // Skip if already tracked (same sha)
              const sha = commit.id.substring(0, 7);
              if (allEntries.some(e => e.sha === sha)) continue;

              const time = timeMatch[1].trim();
              const issueMatch = message.match(/Refs:\s*#(\d+)/i);
              const issue = issueMatch ? `#${issueMatch[1]}` : '-';
              const subject = message.split('\n')[0];
              const date = toISODate(new Date(commit.timestamp));
              const author = commit.author.username || commit.author.name;

              allEntries.push({ date, sha, url: commit.url, subject, issue, time, author, minutes: parseTime(time) });
              hasNew = true;
            }

            if (!hasNew) {
              console.log('No new commits with Time-spent found.');
              return;
            }

            // Sort by date desc (most recent first)
            allEntries.sort((a, b) => b.date.localeCompare(a.date));

            // --- Compute summaries ---
            const totalMinutes = allEntries.reduce((sum, e) => sum + e.minutes, 0);

            // By issue
            const byIssue = {};
            for (const e of allEntries) {
              if (!byIssue[e.issue]) byIssue[e.issue] = { minutes: 0, count: 0 };
              byIssue[e.issue].minutes += e.minutes;
              byIssue[e.issue].count++;
            }

            // By month
            const byMonth = {};
            for (const e of allEntries) {
              const d = new Date(e.date + 'T00:00:00Z');
              const key = `${monthNames[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
              if (!byMonth[key]) byMonth[key] = 0;
              byMonth[key] += e.minutes;
            }

            // --- Render report ---
            let report = `# Time Tracking Report\n\n`;
            report += `> **Total: ${formatTime(totalMinutes)}** — ${allEntries.length} commits\n\n`;

            // By issue
            report += `### Par issue\n\n`;
            report += `| Issue | Temps | Commits |\n|-------|-------|---------|\n`;
            for (const [issue, data] of Object.entries(byIssue).sort((a, b) => b[1].minutes - a[1].minutes)) {
              report += `| ${issue} | ${formatTime(data.minutes)} | ${data.count} |\n`;
            }

            // By month
            report += `\n### Par mois\n\n`;
            report += `| Mois | Temps |\n|------|-------|\n`;
            for (const [month, minutes] of Object.entries(byMonth)) {
              report += `| ${month} | ${formatTime(minutes)} |\n`;
            }

            // Detail table
            report += `\n### Commits\n\n`;
            report += `| Date | Commit | Issue | Temps | Auteur |\n`;
            report += `|------|--------|-------|-------|--------|\n`;
            for (const e of allEntries) {
              report += `| ${toFRDate(e.date)} | [\`${e.sha}\`](${e.url}) ${e.subject} | ${e.issue} | ${e.time} | @${e.author} |\n`;
            }

            // Hidden data block (single HTML comment = invisible on GitHub)
            const dataLines = allEntries.map(e =>
              `${e.date}|${e.sha}|${e.url}|${e.subject}|${e.issue}|${e.time}|${e.author}`
            );
            report += `\n<!-- DATA\n${dataLines.join('\n')}\nDATA -->`;

            // --- Update issue ---
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: trackingIssue.number,
              body: report,
            });

            console.log(`Updated #${trackingIssue.number} — ${allEntries.length} entries, total: ${formatTime(totalMinutes)}`);
